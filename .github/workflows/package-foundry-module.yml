name: Package Foundry Module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Read and validate module version
        id: version
        run: |
          version="$(jq -r .version foundry-module/ddb-direct-roll-bridge/module.json)"
          tag="${GITHUB_REF_NAME#v}"
          base_tag="${tag%%-rc.*}"
          if [ "$tag" != "$version" ] && [ "$base_tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate manifests and JavaScript
        run: |
          jq -e '.version == "${{ steps.version.outputs.version }}"' foundry-module/ddb-direct-roll-bridge/module.json
          jq -e '.version == "${{ steps.version.outputs.version }}"' chrome-extension/manifest.json
          find chrome-extension foundry-module -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Package Foundry module
        run: |
          cd foundry-module
          zip -r ../ddb-direct-roll-bridge-v${{ steps.version.outputs.version }}.zip ddb-direct-roll-bridge
          cp ddb-direct-roll-bridge/module.json ../module.json

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DDB Direct Roll Bridge v${{ steps.version.outputs.version }} (${{ github.ref_name }})
          body: "DDB Direct Roll Bridge ${{ github.ref_name }}. See CHANGELOG.md for release details."
          files: |
            ddb-direct-roll-bridge-v${{ steps.version.outputs.version }}.zip
            module.json
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          make_latest: ${{ !contains(github.ref_name, '-rc') }}
