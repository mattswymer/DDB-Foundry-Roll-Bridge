name: Package Foundry Module

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-foundry-module.yml"
      - "foundry-module/ddb-direct-roll-bridge/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package Foundry module
        run: |
          cd foundry-module
          zip -r ../ddb-direct-roll-bridge.zip ddb-direct-roll-bridge

      - name: Publish release and ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: main
          name: DDB Direct Roll Bridge v1.0.1
          body: Install this release through Foundry using the module manifest URL in the README.
          files: ddb-direct-roll-bridge.zip
          make_latest: true
