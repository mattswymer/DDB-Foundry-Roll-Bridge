name: Package Foundry Module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Read and validate module version
        id: version
        run: |
          version="$(jq -r .version foundry-module/ddb-direct-roll-bridge/module.json)"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match module version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package Foundry module
        run: |
          cd foundry-module
          zip -r ../ddb-direct-roll-bridge.zip ddb-direct-roll-bridge

      - name: Publish release and ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DDB Direct Roll Bridge v${{ steps.version.outputs.version }}
          body: Install this release through Foundry using the stable module manifest URL.
          files: ddb-direct-roll-bridge.zip
          make_latest: true
