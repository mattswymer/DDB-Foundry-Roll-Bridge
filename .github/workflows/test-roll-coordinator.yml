name: Roll Coordinator Tests

on:
  push:
    branches:
      - main
    paths:
      - "chrome-extension/roll-coordinator.js"
      - "tests/**"
      - ".github/workflows/test-roll-coordinator.yml"
  pull_request:
    paths:
      - "chrome-extension/roll-coordinator.js"
      - "tests/**"
      - ".github/workflows/test-roll-coordinator.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run coordinator tests
        run: node --test tests/roll-coordinator.test.js
